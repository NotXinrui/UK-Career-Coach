<title id="t">UK Career Coach: audit your application, write it yourself</title>
<desc id="d">An open skill for evaluating job descriptions, finding CV keyword gaps and proofreading. A diagram shows five files packaged into a skill folder and installed in Claude.ai, Claude Code, Gemini CLI or a Gemini app Gem.</desc>
